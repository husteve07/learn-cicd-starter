name: cd

on:
  push: 
    branches: [main]

jobs:
  Deploy: 
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          go-version: "1.27.1"
      - name: set up Go toolchain
        uses: actions/setup-go@v3
        with:
          go-version: "1.27.1"
      - name: build production
        run: bash scripts/buildprod.sh
      