name: cd

on:
  push: 
    branches: [main]

jobs:
  Deploy: 
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: set up Go toolchain
        uses: actions/setup-go@v3
        with:
          go-version: "1.27.1"
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: build production
        run: bash scripts/buildprod.sh
      - name: Set up gcloud auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/521085860866/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'cloud-run-deployer@notely-513203.iam.gserviceaccount.com'
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: build and deploy to Cloud Run
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-513203/notely-ar-repo/notely:latest .
      - name: migrate database
        run: bash scripts/migrate.sh
      - name: Deploy to Cloud Run 
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-513203/notely-ar-repo/notely:latest --region us-central1 --project notely-513203